<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Crust - Staff Workspace Login Portal</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { sage: { 50: '#f4f7f5', 100: '#e6ede8', 600: '#557a61', 700: '#44624e', 800: '#374f3f' } } } }
        }
    </script>
</head>
<body class="bg-slate-900 text-gray-200 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Access Portal Container Frame -->
    <div id="login-container" class="bg-white text-gray-800 rounded-3xl p-8 max-w-md w-full shadow-2xl border border-gray-100 block">
        <div class="text-center mb-6">
            <div class="bg-sage-100 text-sage-700 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">🔒</div>
            <h3 class="text-2xl font-bold font-serif text-gray-900">Staff Workspace Access</h3>
            <p class="text-xs text-gray-500 mt-1">Select a profile to load management workspace.</p>
        </div>
        <div class="space-y-3">
            <button onclick="launchDashboard('Admin')" class="w-full text-left bg-gray-50 hover:bg-sage-50 border border-gray-200 p-4 rounded-xl flex justify-between items-center transition-all group">
                <div>
                    <p class="text-sm font-bold text-gray-900">Admin / Business Owner</p>
                    <p class="text-xs text-gray-500">Full Dashboard Management Access</p>
                </div>
                <span class="text-sage-600">➔</span>
            </button>
            <button onclick="launchDashboard('Sales Staff')" class="w-full text-left bg-gray-50 hover:bg-sage-50 border border-gray-200 p-4 rounded-xl flex justify-between items-center transition-all group">
                <div>
                    <p class="text-sm font-bold text-gray-900">Sales Counter Operator</p>
                    <p class="text-xs text-gray-500">Process Counter Orders</p>
                </div>
                <span class="text-sage-600">➔</span>
            </button>
            <button onclick="launchDashboard('Inventory Staff')" class="w-full text-left bg-gray-50 hover:bg-sage-50 border border-gray-200 p-4 rounded-xl flex justify-between items-center transition-all group">
                <div>
                    <p class="text-sm font-bold text-gray-900">Inventory Coordinator</p>
                    <p class="text-xs text-gray-500">Track Ingredient Budgets</p>
                </div>
                <span class="text-sage-600">➔</span>
            </button>
        </div>
    </div>

    <!-- Main Workspace Container Interface Layout -->
    <div id="workspace-container" class="hidden fixed inset-0 w-full h-full bg-sage-50 text-gray-800 flex flex-col md:flex-row overflow-hidden">
        <aside class="w-full md:w-64 bg-slate-900 text-gray-300 flex flex-col border-r border-slate-800 shrink-0">
            <div class="p-6 border-b border-slate-800">
                <h2 class="text-white font-bold text-lg font-serif">Cozy Crust Workspace</h2>
                <span id="role-badge" class="text-xs text-emerald-400 font-mono tracking-wider block mt-1">● Account Role</span>
            </div>
            <nav class="flex-1 p-4 space-y-1 text-sm font-medium overflow-y-auto">
                <button onclick="switchModule('dashboard')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800 transition-all">📊 Executive Dashboard</button>
                <button onclick="switchModule('inventory')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800 transition-all">📦 Raw Material Stock</button>
                <button onclick="switchModule('sales')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800 transition-all">💰 Order & POS Desk</button>
                <button onclick="switchModule('profitloss')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800 transition-all">📈 P&L Statement</button>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="location.reload()" class="w-full bg-slate-800 hover:bg-rose-950 text-center py-2.5 rounded-xl text-xs font-semibold text-gray-300">🚪 Lock Workspace</button>
            </div>
        </aside>
        <main id="viewport" class="flex-1 p-6 md:p-10 overflow-y-auto"></main>
    </div>

    <script>
        let currentRole = "";
        let currentModule = "dashboard";

        const defaultState = {
            orders: [
                { id: 'ORD-001', customerName: 'Juan Dela Cruz', type: 'Online', items: 'Graham Nest (Classic) x5', quantity: 5, total: 60.00, status: 'Pending', location: 'PRMSU Iba Campus' },
                { id: 'ORD-002', customerName: 'Maria Santos', type: 'POS Counter', items: 'Graham Nest (Flavored) x10', quantity: 10, total: 120.00, status: 'Fulfilled', location: 'Walk-in' }
            ],
            inventory: [
                { item: 'Crushed Grahams', qty: '1 kg', cost: 235.00 },
                { item: 'Condensed Milk', qty: '2 Cans', cost: 110.00 },
                { item: 'Cocoa Powder', qty: '100g', cost: 115.00 },
                { item: 'Chocolate Filling', qty: '500g', cost: 120.00 },
                { item: 'Ube Filling', qty: '500g', cost: 120.00 },
                { item: 'Packaging', qty: '100 pcs', cost: 100.00 }
            ]
        };

        function getAppState() {
            if(!localStorage.getItem('cozyCrustState')) {
                localStorage.setItem('cozyCrustState', JSON.stringify(defaultState));
            }
            return JSON.parse(localStorage.getItem('cozyCrustState'));
        }

        function launchDashboard(role) {
            currentRole = role;
            document.getElementById('login-container').className = 'hidden';
            document.getElementById('workspace-container').className = 'fixed inset-0 w-full h-full bg-sage-50 text-gray-800 flex flex-col md:flex-row overflow-hidden';
            document.getElementById('role-badge').innerText = `● ${role} Profile`;
            renderModule();
        }

        function switchModule(modId) {
            currentModule = modId;
            renderModule();
        }

        function renderModule() {
            const state = getAppState();
            const view = document.getElementById('viewport');
            
            let revenue = state.orders.filter(o => o.status === 'Fulfilled').reduce((a, c) => a + c.total, 0);
            let unitsSold = state.orders.filter(o => o.status === 'Fulfilled').reduce((a, c) => a + c.quantity, 0);
            let cogs = unitsSold * 8.85;

            if (currentModule === 'dashboard') {
                view.innerHTML = `
                    <h1 class="text-3xl font-serif font-black mb-6">Executive Dashboard</h1>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><p class="text-xs font-bold text-gray-400 uppercase">Gross Revenue</p><p class="text-2xl font-black text-sage-600 mt-1">₱${revenue.toFixed(2)}</p></div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><p class="text-xs font-bold text-gray-400 uppercase">Units Dispatched</p><p class="text-2xl font-black text-slate-800 mt-1">${unitsSold} units</p></div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><p class="text-xs font-bold text-gray-400 uppercase">Est. Batch COGS</p><p class="text-2xl font-black text-amber-700 mt-1">₱${cogs.toFixed(2)}</p></div>
                    </div>
                `;
            } else if (currentModule === 'inventory') {
                view.innerHTML = `
                    <h1 class="text-2xl font-serif font-bold mb-4">Stock Asset Ledger</h1>
                    <div class="bg-white rounded-2xl border overflow-hidden shadow-sm">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 border-b font-bold text-gray-500 uppercase tracking-wider text-xs">
                                <tr><th class="p-4">Material / Ingredient</th><th class="p-4">Allocation</th><th class="p-4">Cost Entry</th></tr>
                            </thead>
                            <tbody class="divide-y">
                                ${state.inventory.map(i => `<tr><td class="p-4 font-medium">${i.item}</td><td class="p-4 text-gray-600">${i.qty}</td><td class="p-4 font-bold">₱${i.cost.toFixed(2)}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (currentModule === 'sales') {
                view.innerHTML = `
                    <h1 class="text-2xl font-serif font-bold mb-4">Live System Inflows Desk</h1>
                    <div class="bg-white rounded-2xl border overflow-hidden shadow-sm">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 border-b font-bold text-gray-500 uppercase tracking-wider text-xs">
                                <tr><th class="p-4">ID</th><th class="p-4">Customer</th><th class="p-4">Breakdown</th><th class="p-4">Total</th><th class="p-4">Status</th><th class="p-4">Action</th></tr>
                            </thead>
                            <tbody class="divide-y">
                                ${state.orders.map(o => `
                                    <tr>
                                        <td class="p-4 font-mono">${o.id}</td>
                                        <td class="p-4 font-medium">${o.customerName}</td>
                                        <td class="p-4 text-gray-600">${o.items}</td>
