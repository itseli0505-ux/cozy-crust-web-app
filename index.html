<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cozy Crust - Dashboard & Store</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>

</head>
<body class="bg-sage-50 text-gray-800 font-sans min-h-screen">

    <script>
        const defaultState = {
            currentUser: null,
            currentModule: 'dashboard',
            startupCapital: 1000.00,
            products: [
                { id: 'p1', name: 'Graham Nest (Classic)', batchYield: 100, batchCost: 885.00, costPerPiece: 8.85, sellingPrice: 12.00, stock: 100, lowStockThreshold: 20 },

                { id: 'i2', item: 'Condensed Milk', qty: '2 Cans', cost: 110.00 },
                { id: 'i3', item: 'Cocoa Powder', qty: '100g', cost: 115.00 },
                { id: 'i4', item: 'Chocolate Filling', qty: '500g', cost: 120.00 },
                { id: 'i5', item: 'Ube Filling', qty: '500g', cost: 120.00 },
                { id: 'i6', item: 'Mango', qty: '1/4 kg', cost: 85.00 },
                { id: 'i7', item: 'Packaging', qty: '100 pcs', cost: 100.00 }
            ],
            orders: [
                { id: 'ORD-001', customerName: 'Juan Dela Cruz', type: 'Online', items: 'Graham Nest (Classic) x5', quantity: 5, total: 60.00, status: 'Pending', location: 'PRMSU Iba Campus' },
                { id: 'ORD-002', customerName: 'Maria Santos', type: 'POS Counter', items: 'Graham Nest (Flavored) x10', quantity: 10, total: 120.00, status: 'Fulfilled', location: 'Walk-in' }
            ],
            expenses: [
                { id: 'e1', desc: 'Initial Ingredient & Packaging Purchases', category: 'Inventory Purchases', amount: 885.00, date: '2026-10-15' },
                { id: 'e2', desc: 'Reserved Cash / Miscellaneous Capital', category: 'Miscellaneous', amount: 115.00, date: '2026-10-15' }
            ]
        };

        if (!localStorage.getItem('cozyCrustState')) {
            localStorage.setItem('cozyCrustState', JSON.stringify(defaultState));
        }

        function getState() {
            return JSON.parse(localStorage.getItem('cozyCrustState'));
        }

        function saveState(state) {
            localStorage.setItem('cozyCrustState', JSON.stringify(state));
            renderApp();
        }
    </script>

    <script>
        function showView(viewId) {
            document.getElementById('view-storefront').className = viewId === 'store' ? 'block' : 'hidden';

        }

                                </div>
                            `).join('')}

                                </div>
                            </div>
